---
# Secrets for CMS services
# In production, use sealed-secrets or external-secrets operator instead of
# storing real values here. Values below are base64-encoded placeholders.
#
# To create manually:
#   kubectl create secret generic cms-secrets \
#     --from-literal=mysqlUsername=ecms_user \
#     --from-literal=mysqlPassword=YOUR_PASSWORD \
#     --from-literal=minioAccessKey=ecms_minio \
#     --from-literal=minioSecretKey=YOUR_SECRET \
#     --from-literal=stripeApiKey=sk_live_... \
#     --from-literal=keycloakAdminPassword=YOUR_KC_PASS \
#     -n cms
apiVersion: v1
kind: Secret
metadata:
  name: cms-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  mysqlUsername: {{ .Values.secrets.mysqlUsername | quote }}
  mysqlPassword: {{ .Values.secrets.mysqlPassword | required "secrets.mysqlPassword is required" | quote }}
  minioAccessKey: {{ .Values.secrets.minioAccessKey | quote }}
  minioSecretKey: {{ .Values.secrets.minioSecretKey | quote }}
  stripeApiKey: {{ .Values.secrets.stripeApiKey | quote }}
  keycloakAdminPassword: {{ .Values.secrets.keycloakAdminPassword | quote }}
