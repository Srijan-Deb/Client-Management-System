global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend client_api_front
    bind *:8081
    default_backend client_api_back

backend client_api_back
    balance roundrobin
    server client-service-1 cms-client-service-1:8081 check
    server client-service-2 cms-client-service-2:8081 check

frontend keycloak_front
    bind *:8080
    default_backend keycloak_back

backend keycloak_back
    server keycloak cms-keycloak-cluster:8080 check
