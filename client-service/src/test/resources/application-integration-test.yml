# Test Security Override
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Spring Security's SecurityFilterChain cannot be fully disabled via YAML alone.
# The IntegrationTestSecurityConfig class (src/test/java/.../config/) registers
# a high-precedence SecurityFilterChain bean that permits all requests, replacing
# the production chain only when the "integration-test" profile is active.
# See: com.cms.client.config.IntegrationTestSecurityConfig
