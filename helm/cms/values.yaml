# ==============================================================================
# values.yaml - Default values for CMS Helm chart
# ==============================================================================
# Override any value with:
#   helm install cms ./helm/cms --set global.imageTag=1.2.3
#   helm install cms ./helm/cms -f my-overrides.yaml
# ==============================================================================

# Global settings shared by all services
global:
  # Replace srijan-deb with your actual GitHub username/org
  imageRegistry: ghcr.io/srijan-deb
  imageTag: latest
  imagePullPolicy: Always
  # imagePullSecrets:
  #   - name: ghcr-credentials

# ── Service definitions ──────────────────────────────────────────────────────
# Each service can override any of the defaults below independently
services:
  cms-admin:
    enabled: true
    replicaCount: 1
    image:
      name: cms-admin
    containerPort: 80
    service:
      port: 80
      type: ClusterIP
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
    env:
      # These environment variables might be ignored if baked in at build time,
      # but are kept here for consistency or if we switch to runtime injection.
      VITE_API_BASE_URL: "http://api-gateway.cms.svc.cluster.local:8090"
    ingress:
      enabled: true
      host: admin.cms.example.com
      path: /
      pathType: Prefix
      annotations:
        kubernetes.io/ingress.class: traefik

  api-gateway:
    enabled: true
    replicaCount: 2
    image:
      name: cms-api-gateway
    containerPort: 8090
    service:
      port: 8090
      type: ClusterIP
    resources:
      requests:
        cpu: "250m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      SPRING_PROFILES_ACTIVE: prod
    ingress:
      enabled: true
      host: cms.example.com
      path: /
      pathType: Prefix
      annotations:
        kubernetes.io/ingress.class: traefik

  client-service:
    enabled: true
    replicaCount: 2
    image:
      name: cms-client-service
    containerPort: 8081
    service:
      port: 8081
      type: ClusterIP
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "750m"
        memory: "768Mi"
    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_REPLICA_URL: "jdbc:mysql://cms-mysql-secondary:3306/cms_client?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8"
    ingress:
      enabled: false

  account-service:
    enabled: true
    replicaCount: 2
    image:
      name: cms-account-service
    containerPort: 8082
    service:
      port: 8082
      type: ClusterIP
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "750m"
        memory: "768Mi"
    env:
      SPRING_PROFILES_ACTIVE: prod
    ingress:
      enabled: false

  billing-service:
    enabled: true
    replicaCount: 2
    image:
      name: cms-billing-service
    containerPort: 8083
    service:
      port: 8083
      type: ClusterIP
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "750m"
        memory: "768Mi"
    env:
      SPRING_PROFILES_ACTIVE: prod
    ingress:
      enabled: false

  notification-service:
    enabled: true
    replicaCount: 2
    image:
      name: cms-notification-service
    containerPort: 8084
    service:
      port: 8084
      type: ClusterIP
    resources:
      requests:
        cpu: "125m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      SPRING_PROFILES_ACTIVE: prod
    ingress:
      enabled: false

# ── Shared non-sensitive configuration (rendered into cms-config ConfigMap) ──
config:
  mysql:
    host: cms-mysql
    port: "3306"
  kafka:
    bootstrapServers: cms-kafka:9092
  redis:
    host: cms-redis
    port: "6379"
  keycloak:
    issuerUri: http://host.k3d.internal:8080/realms/cms
  minio:
    endpoint: http://cms-minio:9000
  otel:
    endpoint: http://cms-jaeger:4317

# ── HPA (Horizontal Pod Autoscaler) ─────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# ── Secrets (injected via Kubernetes Secret or external-secrets operator) ────
# Do NOT put real values here. Override via --set or a sealed-secrets file.
secrets:
  mysqlUsername: ecms_user
  mysqlPassword: "cms_password"
  minioAccessKey: ecms_minio
  minioSecretKey: "ecms_minio_secret"
  stripeApiKey: "sk_test_123"
  keycloakAdminPassword: "admin"
