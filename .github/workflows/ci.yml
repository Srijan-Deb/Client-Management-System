# ==============================================================================
# CMS - CI/CD Pipeline
# ==============================================================================
# Jobs:
#   test        - compile + run ALL tests (Testcontainers: real MySQL + Kafka)
#   sonar       - SonarQube quality gate (runs against hosted SonarCloud or
#                 self-hosted; uses SONAR_TOKEN secret)
#   build-push  - build OCI images via Buildpacks, push to GHCR (main only)
# ==============================================================================

name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  # Replace srijan-deb with your actual GitHub username/org
  IMAGE_PREFIX: ghcr.io/srijan-deb

jobs:
  # ============================================================================
  # JOB 1: test
  # Compiles the full multi-module project and runs every test (unit + IT).
  # Testcontainers spins up real MySQL 8 + Kafka containers inside the GHA
  # Docker daemon (ubuntu-latest ships with Docker pre-installed).
  # ============================================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Testcontainers needs Docker. ubuntu-latest has it; no extra setup needed.
    # RYUK disabled to prevent container-cleanup races in CI.
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Suppress Testcontainers cloud banner
      TESTCONTAINERS_CHECKS_DISABLE: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Cache the local Maven repository keyed on all pom.xml files.
      # A cache hit saves ~2 min of dependency downloads per run.
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Run all tests. Testcontainers automatically pulls mysql:8.0 and
      # confluentinc/cp-kafka:7.6.1 from Docker Hub inside the GHA runner.
      - name: Run tests
        run: |
          mvn --batch-mode --no-transfer-progress \
              -Dspring.profiles.active=integration-test \
              test

      # Publish test results so GitHub shows per-test pass/fail in the UI.
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Results
          path: "**/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

  # ============================================================================
  # JOB 2: frontend-test
  # Runs Vitest (unit/component) and Playwright (E2E) tests for cms-admin.
  # ============================================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cms-admin

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./cms-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit & component tests (Vitest)
        run: npm run test -- --run

      # E2E tests require a live Keycloak + backend stack which is not
      # available in CI. Only run them when a dedicated E2E environment is set up.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        if: false

      - name: Run E2E tests (Playwright)
        run: npm run test:e2e
        if: false
        env:
          CI: true

  # ============================================================================
  # JOB 3: sonar
  # Runs after tests pass. Sends analysis to SonarCloud (free for public repos)
  # or a self-hosted SonarQube instance.
  #
  # Required secrets:
  #   SONAR_TOKEN  - generate at sonarcloud.io (Settings -> Security -> Tokens)
  #                  OR from your local SonarQube admin panel
  #   SONAR_HOST_URL - e.g. https://sonarcloud.io  OR  http://your-server:9000
  # ============================================================================
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: test
    # Only run when SONAR_TOKEN secret is configured to avoid hard failures
    if: github.event_name == 'push' && secrets.SONAR_TOKEN != ''

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Full history required for accurate blame/coverage diff in SonarQube
          fetch-depth: 0

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Compile + run tests with JaCoCo coverage so Sonar picks up line coverage.
      - name: Compile and generate coverage
        run: |
          mvn --batch-mode --no-transfer-progress \
              -DskipTests=false \
              -Pcoverage \
              verify
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          TESTCONTAINERS_CHECKS_DISABLE: "true"

      - name: SonarQube analysis
        run: |
          mvn --batch-mode --no-transfer-progress \
              sonar:sonar \
              -Dsonar.organization="srijan-dhabal-deb" \
              -Dsonar.projectKey="srijan-deb" \
              -Dsonar.projectName="Client Management System" \
              -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
              -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml \
              -Dsonar.java.source=21

  # ============================================================================
  # JOB 3: build-push
  # Runs only on pushes to main (not on PRs) and only after tests pass.
  # Uses spring-boot-maven-plugin:build-image (Paketo Buildpacks) to produce
  # a production-ready OCI image for each service, then pushes to GHCR.
  #
  # GITHUB_TOKEN is automatically injected by GHA - no manual secret needed
  # for GHCR push as long as the repo's package permissions are set to "write".
  # ============================================================================
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Grant write permission to push to GHCR (tied to this repo)
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api-gateway
            artifact: api-gateway
          - name: client-service
            artifact: client-service
          - name: account-service
            artifact: account-service
          - name: billing-service
            artifact: billing-service
            type: spring-boot
          - name: notification-service
            artifact: notification-service
            type: spring-boot
          - name: cms-admin
            artifact: admin
            type: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Install parent POM first, then common module (both required by all services)
      - name: Install parent POM and common module
        run: |
          mvn --batch-mode --no-transfer-progress \
              -DskipTests \
              -N install
          mvn --batch-mode --no-transfer-progress \
              -DskipTests \
              -pl common install

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Spring Boot Buildpacks Build ───
      - name: Build and push Spring Boot image for ${{ matrix.service.name }}
        if: matrix.service.type == 'spring-boot' || matrix.service.type == ''
        run: |
          mvn --batch-mode --no-transfer-progress \
              -DskipTests \
              -pl ${{ matrix.service.name }} \
              spring-boot:build-image \
              -Dspring-boot.build-image.publish=true \
              -Dspring-boot.build-image.builder=paketobuildpacks/builder-jammy-base:latest
        env:
          DOCKER_PUBLISH_REGISTRY_ADDRESS: ${{ env.REGISTRY }}
          DOCKER_PUBLISH_REGISTRY_USERNAME: ${{ github.actor }}
          DOCKER_PUBLISH_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # ─── Frontend Docker Build ───
      - name: Build and push Frontend image
        if: matrix.service.type == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.name }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cms-${{ matrix.service.artifact }}:latest
          build-args: |
            VITE_API_BASE_URL=http://cms.example.com/api
            VITE_KEYCLOAK_URL=http://auth.example.com
            VITE_KEYCLOAK_REALM=cms
            VITE_KEYCLOAK_CLIENT_ID=cms-admin

      - name: Image digest summary
        run: |
          echo "## Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository_owner }}/cms-${{ matrix.service.artifact }}:latest" >> $GITHUB_STEP_SUMMARY
